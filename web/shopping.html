<style>
/* Kitty Mart. Drawn with the shared sheet and Habit Kitty's; these are its own parts. Only the shared colour variables. */
.shop-body { display: grid; gap: var(--s4); }
.shopping .grow { flex: 1; }
.shopping h4, .shop-dialog h4 { margin: 0; font: 700 20px/1.2 var(--font); }
.shopping .stack, .shop-dialog .stack { display: grid; gap: var(--s4); }
.shop-undo { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-size: 16px; }
.shop-undo .muted { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* the add box: the field and its button side by side */
.shop-add { display: flex; gap: var(--s3); align-items: end; }
.shop-add .field { flex: 1; }
.shop-add .btn { flex: none; }
.shop-complete, .shop-pins { display: flex; flex-wrap: wrap; gap: var(--s2); }
.shop-complete:empty { display: none; }
.shop-pins .star, .reg-name .star { color: var(--accent-text); }
/* the supermarkets: a row of tabs that scrolls sideways, and the + List key */
.shop-stores { display: flex; gap: var(--s2); align-items: center; }
.shop-stores .seg { flex: 1; min-width: 0; overflow-x: auto; }
.shop-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.shop-list { gap: var(--s4); }
.shop-group { display: grid; gap: var(--s2); }
.shop-group h4 { font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.shop-items { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.shop-item { display: grid; grid-template-columns: 1fr auto; gap: var(--s1) var(--s3); align-items: center; }
.shop-item .check { align-items: center; font-size: 20px; }
.shop-item .iname { overflow-wrap: anywhere; }
.shop-item .ikeys { display: flex; gap: var(--s1); }
.shop-item .qty { color: var(--accent-text); }
.shop-item.done .iname { text-decoration: line-through; text-decoration-thickness: calc(2 * var(--px)); color: var(--muted); }
.shop-item.done .qty { color: inherit; }
/* the recipe it is for, greyed out: "Broccoli (Veg stir fry)" */
.shop-item .from { color: var(--muted); font-size: 16px; }
/* a sub-category inside a category */
.shop-group h5 { margin: var(--s1) 0 0; font: 700 16px/1.2 var(--font); color: var(--muted); }
.shopping .gear.sm { width: calc(10 * var(--u)); height: calc(10 * var(--u)); }
/* "Also in Aldi shopping list." */
.dup { grid-column: 1 / -1; color: var(--bad); font-size: 16px; font-weight: 700; }
.dup .linkish { font-size: 16px; color: var(--bad); }
.shop-foot { display: grid; gap: var(--s3); padding-top: var(--s2); border-top: var(--px) dashed var(--line); }
.shop-foot .btn.primary { width: 100%; }
/* suggestions */
.shop-sugg > summary .num { font-size: 20px; }
.sgroup { display: grid; gap: var(--s2); }
.sgroup h4 .muted { font-size: 16px; font-weight: 400; }
.srows { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.srows li { display: flex; align-items: center; gap: var(--s2); }
.sname { flex: 1; min-width: 0; display: grid; font-size: 18px; line-height: 1.15; overflow-wrap: anywhere; }
.sname .muted { font-size: 16px; }
/* recipes */
.shop-bar { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.shop-cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s3); }
.shop-card { width: 100%; text-align: left; gap: var(--s1); padding: var(--s4); font-size: 20px; cursor: pointer; }
.shop-card b { overflow-wrap: anywhere; }
.shop-card .muted { font-size: 16px; }
.ings { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.ings li { display: flex; justify-content: space-between; align-items: center; gap: var(--s3); font-size: 20px; }
.ings li.ok > span:first-child { color: var(--muted); }
.badge { flex: none; font-size: 14px; font-weight: 700; padding: 0 var(--s2); background: var(--surface2); color: var(--muted); }
.badge.ok { color: var(--ok); }
.badge.need { background: var(--accent-soft); color: var(--accent-text); }
.recipe-to { display: flex; gap: var(--s3); align-items: end; flex-wrap: wrap; }
.recipe-to .field { flex: 1 1 calc(40 * var(--u)); }
.recipe-notes { white-space: pre-line; font-size: 18px; overflow-wrap: anywhere; border-top: var(--px) dashed var(--line); padding-top: var(--s3); }
/* pantry: the categories as the notes' window cards (web/notes.html), two to a row but square */
.pcard { --note-ratio: 6 / 5; }
/* the pantry as one list: a panel per category */
#pantry-main { display: grid; gap: var(--s4); }
.pcard .nart { width: 34%; }
.pcard .ncard-text { font-size: 18px; }
.pcard .ncard-foot { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.pcard .ncard-foot::after { display: none; }
/* a sticker in the category's colour, outside a window: the title of its page, the picture choices */
.pcat-title, .pick-fold { --nc: var(--accent); --sq: var(--nc); --dk: color-mix(in srgb, var(--nc) 25%, #231d44); }
.pcat-title { display: flex; align-items: center; gap: var(--s3); min-width: 0; overflow-wrap: anywhere; }
.pcat-title .nart, .pick-fold .nart { width: calc(10 * var(--u)); flex: none; }
.shopping .nart .sticker, .shop-dialog .nart .sticker { display: block; }
/* a thing in the pantry: its name (tap to change it), then − + and Low */
.prow { display: flex; align-items: center; gap: var(--s2); }
.pname { flex: 1; min-width: 0; display: grid; gap: var(--px); padding: var(--s1) 0; text-align: left; background: none; border: 0; font: inherit; font-size: 20px; color: var(--ink); cursor: pointer; }
.pname .iname { overflow-wrap: anywhere; }
.pname .qty { color: var(--accent-text); }
.pname .muted { font-size: 16px; }
.pname:hover .iname { text-decoration: underline; text-decoration-thickness: var(--px); }
.pkeys { display: flex; gap: var(--s1); flex: none; align-items: center; }
.btn.step { min-width: calc(10 * var(--u)); padding-inline: 0; font-size: 20px; }
.pshelf-add .field { min-width: 0; }
.pshelf-add .field + .field { flex: 0 1 40%; }
.pshelf-add select { width: 100%; }
/* the category dialog: sub-categories to rename or delete, and the picture choices */
.subrows { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.subrows:empty { display: none; }
.subrows li { display: flex; gap: var(--s2); align-items: center; }
.subrows .field { flex: 1; }
.subrows .up .pxs, .subrows .down .pxs { transform: rotate(90deg); }
.subrows li:first-child .up, .subrows li:last-child .down { visibility: hidden; }
.pick-fold > summary { display: flex; align-items: center; gap: var(--s3); cursor: pointer; list-style: none; font-weight: 700; }
.pick-fold > summary::-webkit-details-marker { display: none; }
.pick-fold > summary::after { content: "+"; margin-left: auto; color: var(--muted); }
.pick-fold[open] > summary::after { content: "-"; }
.picons { margin-top: var(--s3); }
/* pantry: the Low key */
.btn.low[aria-pressed="true"] { background: var(--warn-bg); color: var(--warn-ink); }
/* regulars */
.regs { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.reg { width: 100%; display: grid; gap: var(--s1); text-align: left; padding: var(--s3); background: var(--surface2); border: var(--px) solid var(--line); color: var(--ink); cursor: pointer; }
.reg:hover { border-color: var(--edge); }
.reg-name { display: flex; align-items: center; gap: var(--s2); font-size: 20px; overflow-wrap: anywhere; }
.reg .chips { display: flex; flex-wrap: wrap; gap: var(--s1); }
.reg .chips:empty { display: none; }
.reg .chip { margin: 0; font-size: 14px; }
.reg-stat { font-size: 16px; }
.every input { width: calc(20 * var(--u)); padding: var(--s1); font-size: 18px; background: var(--surface2); border: var(--px) solid var(--line); }
/* the trip dialog: keep or delete each item that was not bought */
.trip-left { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.trip-left li { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-size: 18px; }
.keepdrop { display: flex; flex: none; }
.keepdrop label { position: relative; display: inline-flex; cursor: pointer; }
.keepdrop input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.keepdrop span { padding: var(--s1) var(--s3); font-size: 16px; font-weight: 700; background: var(--surface2); border: var(--px) solid var(--line); color: var(--muted); }
.keepdrop input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-edge); }
.keepdrop input[value="drop"]:checked + span { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.keepdrop input:focus-visible + span { outline: var(--bw) solid var(--accent-text); outline-offset: calc(-2 * var(--bw)); }
.shop-dialog .btns { flex-wrap: wrap; align-items: center; }
.shop-dialog .grow { flex: 1; }
#shop-toast .linkish { color: var(--accent-text); font-weight: 700; margin-left: var(--s2); }
</style>
<div data-app-root="shopping" hidden>
  <div class="wrap shopping">
    <header class="top" id="shop-top"></header>
    <div class="shop-body" id="shop-body"></div>
  </div>
  <div id="shop-layer-host"></div>
  <div class="toast" id="shop-toast" role="status" hidden></div>
</div>
