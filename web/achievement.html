/* ---------- achievement cards ---------- */
/* A trading card drawn as a little pixel camera: a screwed frame, a top bar (icon and name), a graph-paper screen
   (date, picture, a few words) and a footer (place). Its pixel is --cu, about one --px, set from the screen width by the
   app (see fitCards). Every colour comes from the side-quest colour (--sq), so all the cards of a side quest
   match and recolouring repaints them; the rarity (--rar) only colours the stars and the glow. */
/* The card is 108 of its own pixels wide, and its height leaves room for a 4:3 photo (the screen is 82 wide, so 61.5 tall) under a two-line note.
   Its text is sized in the same pixels, so that stays true at every size. A short note gives the photo more room. */
/* Every card is the same size wherever it is: the collection, the detail view and the form preview. */

  --frame: color-mix(in srgb, var(--sq) 55%, var(--surface)); --hi: color-mix(in srgb, var(--sq) 22%, var(--surface)); --inner: var(--hi); --scr: var(--hi);
  --dith: color-mix(in srgb, var(--dk) 28%, transparent);
  --panel: color-mix(in srgb, var(--sq) 9%, var(--surface)); --gl: color-mix(in srgb, var(--sq) 16%, var(--surface));
  --txt: color-mix(in srgb, var(--sq) 50%, var(--ink));
  /* the frame and its three boxes: one-pixel outlines with one pixel cut from every corner */
  --fnotch: polygon(0 var(--cu), var(--cu) var(--cu), var(--cu) 0, calc(100% - var(--cu)) 0, calc(100% - var(--cu)) var(--cu), 100% var(--cu),
    100% calc(100% - var(--cu)), calc(100% - var(--cu)) calc(100% - var(--cu)), calc(100% - var(--cu)) 100%, var(--cu) 100%, var(--cu) calc(100% - var(--cu)), 0 calc(100% - var(--cu)));
  position: relative; display: block; flex: none; width: calc(108 * var(--cu)); height: calc(182.5 * var(--cu)); padding: var(--pad); border: 0; text-align: left; background: none;
  color: var(--txt); cursor: pointer; }
/* the boxes' corner pixels, so their two-pixel outlines stay two pixels round the corners (see page.html) */
.icon-pick span, .swatch, .tag, .side-box, .block, .tag-sug, .chip, .icon-fold > summary, .gallery button, .manage li { position: relative; }
.icon-pick span::after, .swatch::after, .tag::after, .side-box::after, .block::after, .menu-list::after, .tag-sug::after, .chip::after, .photo::after, .icon-fold > summary::after, .gallery button::after, .manage li::after {
  content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none; border: var(--bw) solid; border-color: inherit;
  -webkit-mask-box-image: var(--patch-box); }

.card .rim { position: absolute !important; top: calc(24 * var(--cu)); bottom: calc(24 * var(--cu)); width: calc(var(--pad) - 2 * var(--cu)); display: block !important;
  writing-mode: vertical-rl; text-align: center; font: 700 max(12px, calc(8.5 * var(--cu)))/calc(var(--pad) - 2 * var(--cu)) var(--font); letter-spacing: .14em; text-indent: .14em; text-transform: uppercase; white-space: nowrap;

.card.static:hover { transform: none; }
.card-head { height: calc(33 * var(--cu)); overflow: hidden; display: flex !important; align-items: center; gap: calc(3 * var(--cu)); padding: calc(2 * var(--cu)) calc(3 * var(--cu));
  background: var(--panel); box-shadow: inset 0 calc(-1 * var(--cu)) 0 var(--gl); min-height: calc(11 * var(--cp)); }
.card-title { flex: 1; font: 700 calc(6.3 * var(--cp))/1.05 var(--font); color: var(--txt); overflow: hidden; display: -webkit-box !important; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.card-screen { position: relative; overflow: hidden; display: grid !important; grid-template-rows: auto minmax(calc(36 * var(--cu)), 1fr) auto; padding: calc(2 * var(--cu)) calc(3 * var(--cu)) calc(3 * var(--cu));
  background:
    linear-gradient(var(--gl) var(--cu), transparent 0) calc(-1 * var(--cu)) calc(-1 * var(--cu)) / calc(8 * var(--cu)) calc(8 * var(--cu)),
    linear-gradient(90deg, var(--gl) var(--cu), transparent 0) calc(-1 * var(--cu)) calc(-1 * var(--cu)) / calc(8 * var(--cu)) calc(8 * var(--cu)),
    var(--panel); }

.card-art > .pxs { grid-area: 1 / 1; }

.card-art img { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; object-fit: cover; border: var(--cu) solid var(--dk); clip-path: var(--fnotch); }
.card-art.has-photo .card-deco { left: calc(2 * var(--cu)); bottom: calc(2 * var(--cu)); }
.card-desc { color: var(--txt); text-align: center; font-size: max(12px, calc(5.3 * var(--cp))); line-height: 1.1; overflow: hidden; display: -webkit-box !important; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.card-foot { height: calc(26 * var(--cu)); display: flex !important; align-items: center; gap: calc(3 * var(--cu)); padding: calc(2 * var(--cu)) calc(3 * var(--cu)); background: var(--panel); box-shadow: inset 0 var(--cu) 0 var(--gl); }

.lockmark .pxs { width: calc(7 * var(--cp)); }

/* Rarity: the stars are in --rar (set on the card: grey, green, blue, purple, yellow). Everything above common also glows in that colour,
   the same size for all of them: a bit of strong colour next to the card, fading out. Common has no glow. */
.card.rar-uncommon, .card.rar-rare, .card.rar-mythical, .card.rar-legendary {
  filter: drop-shadow(0 0 calc(2 * var(--cu)) color-mix(in srgb, var(--rar) 90%, transparent)) drop-shadow(0 0 calc(4 * var(--cu)) color-mix(in srgb, var(--rar) 45%, transparent)); }

.card.planned { --frame: var(--line); --sq: color-mix(in srgb, var(--sqc) 28%, #b4b0c2); --sq-ink: #231d44; }
.card.planned .card-in { filter: saturate(.15); opacity: .8; }

/* the moment a planned card is unlocked: colour floods back in, in a few steps */

}
