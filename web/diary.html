<style>
/* The Diary screen. Drawn with Habit Kitty's stylesheet (calendar, moods, panels and buttons live there); these are its own parts. */
[data-app-root="diary"] { image-rendering: auto; }
.diary .brand h1 span { color: var(--accent-text); }
.diary-body { display: grid; gap: var(--s5); }
.dhead { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.dhead h3 { font: 700 22px/1.1 var(--font); }
.dhead .muted { font-size: 18px; }
.dhead .btns .btn { flex: none; }
.dc .bday { position: absolute; right: var(--s1); top: var(--s1); width: calc(7 * var(--px)); height: calc(6 * var(--px)); color: var(--accent-text); }
.dc .bday svg { width: 100%; height: 100%; }
.bday-ico { display: inline-flex; vertical-align: middle; width: calc(7 * var(--px)); height: calc(6 * var(--px)); color: var(--accent-text); }
.bday-ico svg { width: 100%; height: 100%; }
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--s2); }
.dlist li { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); font-size: 20px; }
.dlist .who { display: grid; gap: 0; min-width: 0; overflow-wrap: anywhere; }
.dlist .who .muted { font-size: 16px; line-height: 1.2; }
.dlist .soon { color: var(--accent-text); font-weight: 700; white-space: nowrap; }
.tally { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); font-size: 18px; color: var(--muted); }
.tally span { display: inline-flex; align-items: center; gap: var(--s2); }
.reflect-text { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 500 20px/1.4 var(--font); }
.dform { display: grid; gap: var(--s4); }
.dform .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--s3); }
.dform .row.two { grid-template-columns: 1fr 1fr; }
.dform .reflect-area { min-height: calc(70 * var(--px)); font: 500 20px/1.4 var(--font) !important; resize: none; }
</style>
<div data-app-root="diary" hidden>
  <div class="wrap diary">
    <header class="top" id="diary-top"></header>
    <div class="diary-body" id="diary-body"></div>
  </div>
  <div id="diary-modal" hidden></div>
  <div class="toast" id="diary-toast" role="status" hidden></div>
</div>
