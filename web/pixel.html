<style>
/* Kitty Gallery. Drawn with the shared sheet and Habit Kitty's; these are its own parts. Only the shared colour variables. */
.pixel-body { display: grid; gap: var(--s4); }
.pixel .pix-cats { overflow-x: auto; }
.pixel h3 .num { font-size: 16px; }
.pix-intro .btns, .pix-save .btns { justify-content: flex-start; }
.pix-badge, .pixel .badge { flex: none; font-size: 14px; font-weight: 700; padding: 0 var(--s2); background: var(--surface2); color: var(--muted); }
.pixel .badge.new { background: var(--accent-soft); color: var(--accent-text); }
.pixel .badge.changed { background: var(--warn-bg); color: var(--warn-ink); }
/* a group: its icons as tiles, as many to a row as fit */
.pix-ghead { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); }
.pix-ghead h3 { margin: 0; text-transform: capitalize; }
.pix-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(24 * var(--u)), 1fr)); gap: var(--s2); }
.pix-tile { display: grid; justify-items: center; align-content: start; gap: var(--s1); padding: var(--s2) var(--s1); min-width: 0; cursor: pointer;
  background: var(--surface2); border: var(--px) solid var(--line); font: inherit; color: inherit; }
.pix-tile:hover { border-color: var(--edge); }
.pix-tile:focus-visible { outline: var(--bw) solid var(--accent-text); outline-offset: calc(-1 * var(--bw)); }
.pix-tile .pix-pic { display: grid; place-items: center; min-height: calc(36 * var(--px)); }
.pix-tile[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent-edge); box-shadow: inset 0 0 0 var(--px) var(--accent-edge); }
.pix-tile[aria-pressed="true"] .pix-tname { color: var(--accent-text); font-weight: 700; }
.pix-tname { font-size: 16px; color: var(--ink); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* organising: the bar with what is picked stays at the bottom of the screen */
.pix-orgbar { position: sticky; bottom: var(--s3); z-index: 3; gap: var(--s3); border-color: var(--accent-edge); }
.pix-orgbar p { margin: 0; }
.pix-orgrow { display: grid; gap: var(--s3); grid-template-columns: repeat(auto-fit, minmax(calc(48 * var(--u)), 1fr)); }
.pix-orgbar .btns { justify-content: flex-start; }
/* a group dropdown and the name of a new group */
.pixel .pix-gnew[hidden] { display: none; }
/* pictures drawn bigger than one art pixel per --px (the board's previews and the tiles) */
.pixel .pxs.x2 { width: calc(var(--w) * 2 * var(--px)); height: calc(var(--h) * 2 * var(--px)); }
.pixel .pxs.x4 { width: calc(var(--w) * 4 * var(--px)); height: calc(var(--h) * 4 * var(--px)); }
.pixel .pxs.ico, .pixel .pxs:not(.fine) { fill: currentColor; }
.pix-tiles .pxs:not(.fine) { color: var(--ink); }

/* ---- the board ---- */
.pix-draw { gap: var(--s3); }
.pix-dhead { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.pix-dhead h3 { margin: 0; }
.pix-tools { display: flex; gap: var(--s2); flex-wrap: wrap; }
.pix-tools .seg:first-child { flex: 1; }
/* the tools are icons, so the bar fits a phone without scrolling */
.pix-tools .seg { grid-auto-columns: 1fr; }
.pix-tools .seg button { display: grid; place-items: center; padding: var(--s1) var(--s2); }
.pix-tico { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pix-board-wrap { display: grid; justify-items: center; min-width: 0; padding: var(--bw); }
/* one cell per pixel, as big as fits; the empty ones a checker, the grid lines a faint lavender */
.pix-board { display: grid; grid-template-columns: repeat(var(--bw-cells), 1fr); grid-template-rows: repeat(var(--bh-cells), 1fr);
  width: min(100%, calc(var(--bw-cells) * 28px), calc(60vh * var(--bw-cells) / var(--bh-cells))); aspect-ratio: var(--bw-cells) / var(--bh-cells);
  touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair;
  background: repeating-conic-gradient(var(--surface) 0 25%, var(--surface2) 0 50%) 0 0 / calc(200% / var(--bw-cells)) calc(200% / var(--bh-cells));
  box-shadow: 0 0 0 var(--bw) var(--edge); }
.pix-board > i { display: block; box-shadow: inset 0 0 0 .5px var(--grid); }
.pix-board { position: relative; overflow: hidden; }
/* the selection: a dashed box (on a light edge, so it shows on any colour); lifted, it is tinted and can be dragged */
.pix-sel { position: absolute; box-sizing: border-box; border: 2px dashed var(--accent-text); box-shadow: 0 0 0 1px var(--surface), inset 0 0 0 1px var(--surface); cursor: move; }
.pix-sel.lifted { background: color-mix(in srgb, var(--accent) 16%, transparent); }
.pix-selbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: var(--s2) var(--s3); font-size: 16px; text-align: center; }
.pix-selbar:empty { display: none; }
.pix-selbar .btns { justify-content: center; }
.pix-actions { display: flex; flex-wrap: wrap; gap: var(--s2); justify-content: center; }
.pix-actions .pix-up .pxs, .pix-actions .pix-down .pxs { transform: rotate(90deg); }
/* the colours: a swatch and its name */
.pix-inks { display: grid; gap: var(--s1); }
/* three to a row, a family per row; a short row stays short. The base colour sits on top, a line under it. */
.pix-irow, .pix-igrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s1); }
.pix-ibase { display: grid; gap: var(--s1); padding-bottom: var(--s2); margin-bottom: var(--s1); border-bottom: var(--bw) solid var(--line); }
.pix-choose { grid-column: span 2; justify-content: center; color: var(--muted); }
.pix-choose:only-child { grid-column: 1 / -1; }
.pix-choose .pxs { flex: none; fill: currentColor; }
.pix-ihead { margin: var(--s3) 0 var(--s2); font-size: 16px; color: var(--muted); }
.pix-ihead:first-of-type { margin-top: 0; }
.pix-ink { display: flex; align-items: center; gap: var(--s2); padding: var(--s1) var(--s2); min-width: 0; cursor: pointer; text-align: left;
  background: var(--surface2); border: var(--px) solid var(--line); font: inherit; font-size: 16px; color: var(--ink); }
.pix-ink i { flex: none; width: calc(8 * var(--u)); height: calc(8 * var(--u)); box-shadow: 0 0 0 var(--px) var(--edge); }
.pix-ink span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pix-ink.base span { color: var(--accent-text); font-weight: 700; }
.pix-ink[aria-checked="true"] { background: var(--accent); border-color: var(--accent-edge); color: var(--accent-ink); }
.pix-ink[aria-checked="true"] span { color: var(--accent-ink); }
.pix-note { font-size: 16px; margin: 0; }
.pix-bases { display: flex; flex-wrap: wrap; justify-content: center; }
.pix-bases button { display: inline-flex; align-items: center; gap: var(--s1); }
.pix-bases i { width: var(--s3); height: var(--s3); box-shadow: 0 0 0 var(--px) var(--edge); }
/* the preview */
.pix-preview { display: grid; gap: var(--s3); }
.pix-preview p { margin: 0; font-size: 16px; }
.pix-prow { display: flex; flex-wrap: wrap; align-items: end; gap: var(--s4); }
.pix-pbig, .pix-psmall { display: grid; justify-items: center; gap: var(--s1); font-size: 14px; color: var(--muted); }
.pix-view { margin-block: var(--s3); }
.pix-view .pix-prow { justify-content: center; }
/* each note colour, as a little screen of a note window (web/notes.html) */
.pix-swatches { gap: var(--s2); }
.pix-on { display: grid; place-items: center; padding: var(--s2); background: color-mix(in srgb, var(--nc) 14%, var(--surface));
  box-shadow: inset 0 0 0 var(--px) color-mix(in srgb, var(--nc) 70%, var(--ink)); }
/* ---- colours ---- */
.pix-colours { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(46 * var(--u)), 1fr)); gap: var(--s2); }
.pix-colours li { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: var(--s3); align-items: center; font-size: 18px; min-width: 0; }
.pix-colours i { grid-row: span 3; width: calc(12 * var(--u)); height: calc(12 * var(--u)); box-shadow: 0 0 0 var(--px) var(--edge); }
.pix-colours b { overflow: hidden; text-overflow: ellipsis; }
.pix-colours .muted { font-size: 16px; }
.pix-colours .badge { justify-self: start; }
.pix-foot { text-align: center; font-size: 16px; }
</style>
<div data-app-root="pixel" hidden>
  <div class="wrap pixel">
    <header class="top" id="pixel-top"></header>
    <div class="pixel-body" id="pixel-body"></div>
  </div>
  <div id="pixel-layer-host"></div>
  <div class="toast" id="pixel-toast" role="status" hidden></div>
</div>
